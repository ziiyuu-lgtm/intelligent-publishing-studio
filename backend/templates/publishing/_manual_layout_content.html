{% if row.visible %}<template data-layout-content><section class="journal-site__page-block journal-site__page-block--{{ row.block.kind }}{% if row.image_url %} has-image{% endif %}{% if row.appearance %} has-block-design block-layout-{{ row.appearance.layout }}{% endif %}"{% if row.appearance %} style="--block-width:{{ row.appearance.width }}%;--block-bg:{{ row.appearance.background }};--block-text:{{ row.appearance.text }};--block-accent:{{ row.appearance.accent }};--block-padding:{{ row.appearance.padding }}px;--block-radius:{{ row.appearance.radius }}px;--block-gap:{{ row.appearance.gap }}px;text-align:{{ row.appearance.alignment }}"{% endif %}>{% if row.image_url %}<img class="journal-site__page-block-image" src="{{ row.image_url }}" alt="{{ row.block.image_alt }}" style="object-fit:{{ row.block.image_fit }};object-position:{{ row.block.image_position }}">{% endif %}<div>{% if row.block.heading %}<h2>{{ row.block.heading }}</h2>{% endif %}{% if row.block.body %}<div>{{ row.block.body|truncatechars:200|linebreaksbr }}</div>{% endif %}{% if row.block.link_label %}<p><span class="manual-canvas-link">{{ row.block.link_label }}</span></p>{% endif %}</div></section></template>{% endif %}
