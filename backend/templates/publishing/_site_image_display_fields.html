{% load i18n %}<div class="appearance-grid"><div class="field"><label for="fit-{{ image_key }}">{% translate "Image display" %}</label><select id="fit-{{ image_key }}" name="fit">{% for value,label in hero_fit_choices %}<option value="{{ value }}"{% if site.hero_asset_id == current_asset and site.hero_fit == value %} selected{% elif site.hero_asset_id != current_asset and value == 'cover' %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="field"><label for="position-{{ image_key }}">{% translate "Image focus" %}</label><select id="position-{{ image_key }}" name="position">{% for value,label in hero_position_choices %}<option value="{{ value }}"{% if site.hero_asset_id == current_asset and site.hero_position == value %} selected{% elif site.hero_asset_id != current_asset and value == 'center' %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div></div>
