{% load i18n %}
<input type="hidden" name="{{ block_form.prefix }}-grid_form_present" value="yes">
<div class="field">{{ block_form.grid_span.label_tag }}{{ block_form.grid_span }}{{ block_form.grid_span.errors }}<small>{{ block_form.grid_span.help_text }}</small>
<div class="actions" aria-label="{% translate 'Common block widths' %}"><button type="button" class="button secondary small" data-grid-span-value="12" data-target="{{ block_form.grid_span.id_for_label }}">{% translate "Full width" %}</button><button type="button" class="button secondary small" data-grid-span-value="6" data-target="{{ block_form.grid_span.id_for_label }}">{% translate "One half" %}</button><button type="button" class="button secondary small" data-grid-span-value="4" data-target="{{ block_form.grid_span.id_for_label }}">{% translate "One third" %}</button><button type="button" class="button secondary small" data-grid-span-value="8" data-target="{{ block_form.grid_span.id_for_label }}">{% translate "Two thirds" %}</button><button type="button" class="button secondary small" data-grid-span-value="3" data-target="{{ block_form.grid_span.id_for_label }}">{% translate "One quarter" %}</button></div></div>
