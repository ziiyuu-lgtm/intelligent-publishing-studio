name: Fictional PostgreSQL workflow probe
on:
  push:
    branches:
      - feature/altavien-closed-review-ci-20261105
permissions:
  contents: read
jobs:
  review-copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run isolated PostgreSQL workflow tests
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql postgresql-client python3-venv rsync
          sudo systemctl start postgresql
          test ! -e /srv/altavien-pg-probe/source
          sudo mkdir -p /srv/altavien-pg-probe/source
          sudo rsync -a --exclude=.git "$GITHUB_WORKSPACE/" /srv/altavien-pg-probe/source/
          sudo chown -R postgres:postgres /srv/altavien-pg-probe/source
          sudo -u postgres python3 -m venv /srv/altavien-pg-probe/source/.venv
          sudo -u postgres /srv/altavien-pg-probe/source/.venv/bin/python -m pip install --disable-pip-version-check --no-input -r /srv/altavien-pg-probe/source/backend/requirements.release-candidate.txt
          sudo /bin/bash /srv/altavien-pg-probe/source/scripts/run_altavien_postgres_probe.sh workflow
