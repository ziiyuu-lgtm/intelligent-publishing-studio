name: Transient service recovery canary
on:
  push:
    branches:
      - feature/altavien-closed-review-ci-20261105
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify restart and runtime unit recovery
        shell: bash
        run: |
          set -euo pipefail
          d=/tmp/altavien-transient-canary
          mkdir "$d"
          printf '#!/bin/bash\nif test -f /tmp/altavien-transient-canary/fail; then exit 9; fi\nexec /bin/sleep 600\n' > "$d/worker"
          sudo systemd-run --unit=altavien-transient-canary --property=Type=exec /bin/bash "$d/worker"
          fragment=$(systemctl show altavien-transient-canary.service -p FragmentPath --value)
          test -f "$fragment"
          sudo cp "$fragment" "$d/unit.backup"
          sudo systemctl restart altavien-transient-canary.service
          systemctl is-active --quiet altavien-transient-canary.service
          echo TRANSIENT_RESTART_PASSED
          touch "$d/fail"
          sudo systemctl restart altavien-transient-canary.service || true
          sleep 2
          systemctl show altavien-transient-canary.service -p LoadState -p ActiveState -p SubState
          rm "$d/fail"
          if ! sudo systemctl start altavien-transient-canary.service; then
            echo TRANSIENT_RECREATE_FROM_RUNTIME_FRAGMENT
            sudo install -m 0644 "$d/unit.backup" /run/systemd/system/altavien-transient-canary.service
            sudo systemctl daemon-reload
            sudo systemctl start altavien-transient-canary.service
          fi
          systemctl is-active --quiet altavien-transient-canary.service
          echo TRANSIENT_RECOVERY_PASSED
          sudo systemctl stop altavien-transient-canary.service || true
          if test -f /run/systemd/system/altavien-transient-canary.service; then
            sudo rm /run/systemd/system/altavien-transient-canary.service
            sudo systemctl daemon-reload
          fi
