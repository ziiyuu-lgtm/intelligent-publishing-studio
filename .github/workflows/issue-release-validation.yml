name: Fictional issue release validation
on:
  pull_request:
    branches:
      - feature/altavien-release-foundation-20261104
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated PostgreSQL and application
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql postgresql-client python3-venv rsync gettext
          sudo systemctl start postgresql
          test ! -e /srv/altavien-pg-probe/source
          sudo mkdir -p /srv/altavien-pg-probe/source
          sudo rsync -a --exclude=.git "$GITHUB_WORKSPACE/" /srv/altavien-pg-probe/source/
          sudo chown -R postgres:postgres /srv/altavien-pg-probe/source
          sudo -u postgres python3 -m venv /srv/altavien-pg-probe/source/.venv
          sudo -u postgres /srv/altavien-pg-probe/source/.venv/bin/python -m pip install --disable-pip-version-check --no-input -r /srv/altavien-pg-probe/source/backend/requirements.release-candidate.txt
      - name: Verify migrations and translations
        run: |
          set -euo pipefail
          cd /srv/altavien-pg-probe/source/backend
          sudo -u postgres /srv/altavien-pg-probe/source/.venv/bin/python manage.py makemigrations --check --dry-run
          msgfmt --check -o /tmp/altavien-chinese.mo locale/zh_Hans/LC_MESSAGES/django.po
          cmp /tmp/altavien-chinese.mo locale/zh_Hans/LC_MESSAGES/django.mo
      - name: Run fictional PostgreSQL workflow
        timeout-minutes: 4
        run: sudo timeout --signal=INT --kill-after=10s 180 /bin/bash /srv/altavien-pg-probe/source/scripts/run_altavien_postgres_probe.sh workflow
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test dependencies
        timeout-minutes: 4
        run: |
          python -m pip install --disable-pip-version-check --no-input -r backend/requirements.browser-checks.txt
      - name: Prepare runner Chrome and Chinese fonts
        timeout-minutes: 4
        run: |
          google-chrome --version
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fonts-wqy-zenhei
      - name: Exercise the real browser workflow with fictional records
        env:
          IPS_BROWSER_CHANNEL: chrome
        run: python scripts/check_issue_release_browser.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: fictional-issue-release-screenshots
          path: artifacts/issue-release-browser/*.png
          retention-days: 7
          if-no-files-found: ignore
